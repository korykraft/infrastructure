---
- name: Create hoppscotch directory
  ansible.builtin.file:
    path: "{{ hoppscotch_dir }}"
    state: directory
    owner: "{{ server_user }}"
    group: "{{ server_user }}"
    mode: "0755"

- name: Copy hoppscotch env file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ hoppscotch_dir }}/.env"
    owner: "{{ server_user }}"
    group: "{{ server_user }}"
    mode: "0600"

- name: Copy hoppscotch docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ hoppscotch_dir }}/docker-compose.yml"
    owner: "{{ server_user }}"
    group: "{{ server_user }}"
    mode: "0644"

- name: Start hoppscotch
  community.docker.docker_compose_v2:
    project_src: "{{ hoppscotch_dir }}"
    state: present

- name: Wait for postgres healthy
  ansible.builtin.command: docker compose -f {{ hoppscotch_dir }}/docker-compose.yml exec -T postgres pg_isready -U hoppscotch
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 15
  delay: 2
  changed_when: false

- name: Run database migrations
  ansible.builtin.command:
    cmd: docker compose -f {{ hoppscotch_dir }}/docker-compose.yml run --rm -e NODE_OPTIONS="--max-old-space-size=512" hoppscotch pnpm exec prisma migrate deploy
  register: hoppscotch_migrate
  changed_when: "'successfully applied' in hoppscotch_migrate.stdout"

- name: Start hoppscotch after migration
  community.docker.docker_compose_v2:
    project_src: "{{ hoppscotch_dir }}"
    state: present

- name: Allow hoppscotch through UFW
  ansible.builtin.command: ufw allow {{ hoppscotch_port }}/tcp
  register: hoppscotch_ufw
  changed_when: "'Rules updated' in hoppscotch_ufw.stdout"
  when: not (ansible_is_docker_test | default(false))
