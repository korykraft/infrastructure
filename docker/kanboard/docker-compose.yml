name: kanboard

# SQLite backend; data lives in the named volumes.
services:
  app:
    image: "kanboard/kanboard:latest"
    container_name: kanboard
    restart: unless-stopped
    ports:
      - "3040:80"
    volumes:
      - data:/var/www/app/data
      - plugins:/var/www/app/plugins
    environment:
      PLUGIN_INSTALLER: "false"

volumes:
  data:
  plugins:
